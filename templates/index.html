<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STEM Tutor</title>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F7F8FB;              /* page background */
            --ink: #1B2A4A;             /* prim. text color */
            --accent: #2F7D6B;          /* prim. accent */
            --accent-warm: #E2A33D;     /* sec. accent */
            --surface: #FFFFFF;         /* card background */
            --border: #E1E4EC;          /* grid lines*/
            --muted: #6B7280;           /* sec. text */
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--bg);

            /* grid lines */
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
        }

        h2 {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 28px;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: -0.5px;

        }
            /* white panel with shadow */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(27, 42, 74, 0.06);
            padding: 20px;
            margin-bottom: 16px

        }

        #setup p {
            text-align: center;
            color: var(--muted);
            margin-bottom: 16px
        }

        #chat {
            height: 420px;
            overflow-y: auto; /* scrollable */
            padding: 4px;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            max-width: 80%;
            line-height: 1.45;
        }
        .tutor {
            background: #EAF4F1;
            color: var(--ink);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .student {
            background: var(--accent-warm);
            color: #3A2A08;
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 4px;
        }
        #input-row, #input-row-chat {
            display: flex;
            gap: 8px;
        }
        /* input disabled while waiting for API response */
        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--ink);
            font-family: 'IBM Plex Mono', monospace;
        }

        input[type="text"]:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        input[type="text"]:disabled {
            opacity: 0.6;
        }
        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: opacity 0.15s ease;

        }
        button:hover { opacity: 0.88; }
        button:disabled {
            background: var(--muted);
            cursor: default;
            opacity: 0.7
        }

        #reset-row button {
            background: var(--surface);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        #history {
            max-height: 200px;
            overflow-y: auto;
        }
        #history h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin: 0 0 10px 0;
        }
        .history-item {
            padding: 10px 8px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            color: var(--ink);
        }
        .history-item:hover {
            background: var(--bg);
        }
    </style>
</head>
<body>
    <h2>STEM Tutor</h2>

    <div id="history" class="card"></div>

    <!-- First screen -->
    <div id="setup" class="card">
        <p>What algebra problem do you need help with?</p>
        <div id="input-row">
            <input type="text" id="problem-input" placeholder="for example: x^2 - x - 6 = 0">
            <button onclick="startSession()">Start</button>
        </div>
    </div>
    <!-- chat/conversation -->
    <div id="chat" class="card" style="display: none;"></div>

    <!-- type field -->
    <div id="input-row-chat" style="display: none;">
        <input type="text" id="message-input" placeholder="Type your answer...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- New Problem -->
    <div id="reset-row" style="display: none; margin-top: 12px;">
        <button onclick="resetSession()">New Problem</button>
    </div>

    <script>
        // Start button
        async function startSession() {
            const problemText = document.getElementById("problem-input").value.trim();
            if (!problemText) return;

            // "Thinking..." (avoid looking frozen)
            document.getElementById("problem-input").disabled = true;
            document.querySelector("#input-row button").disabled = true;
            document.querySelector("#input-row button").textContent = "Thinking...";

            const response = await fetch("/api/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ problem_text: problemText })
            });
            const data = await response.json();

            //unsolvable message and retry
            if (!data.ok) {
                alert(data.error);
                document.getElementById("problem-input").disabled = false;
                document.querySelector("#input-row button").disabled = false;
                document.querySelector("#input-row button").textContent = "Start";
                return;
            }

            // chat interface screen
            document.getElementById("setup").style.display = "none";
            document.getElementById("chat").style.display = "block";
            document.getElementById("input-row-chat").style.display = "flex";
            document.getElementById("reset-row").style.display = "block";

            // tutor: opening question
            addMessage(data.reply, "tutor");

        }

        // active sessions
        async function sendMessage() {
            const input = document.getElementById("message-input");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "student");
            input.value = "";

            input.disabled = true;
            document.querySelector("#input-row-chat button").disabled = true;
            addThinkingIndicator();

            const response = await fetch("/api/message", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message})
            });
            const data = await response.json();

            removeThinkingIndicator();
            addMessage(data.reply, "tutor");

            // enable next message for user
            input.disabled = false;
            document.querySelector("#input-row-chat button").disabled = false;
            input.focus();

        }

        // Student clicks new problem
        // save finished file + refresh history panel
        // clear old chat and show setup screen again
        async function resetSession() {
            await fetch("/api/reset", { method: "POST" });
            loadHistory();

            document.getElementById("chat").innerHTML = "";
            document.getElementById("chat").style.display = "none";
            document.getElementById("input-row-chat").style.display = "none";
            document.getElementById("reset-row").style.display = "none";

            document.getElementById("problem-input").value = "";
            document.getElementById("problem-input").disabled = false;
            document.querySelector("#input-row button").disabled = false;
            document.querySelector("#input-row button").textContent = "Start";
            document.getElementById("setup").style.display = "block";

        }

        // show old sessions
        async function loadHistory() {
            const response = await fetch("/api/history");
            const data = await response.json();

            const panel = document.getElementById("history");
            panel.innerHTML = "";

            if (data.sessions.length === 0) return;

            const heading = document.createElement("h3");
            heading.textContent = "Past Problems";
            panel.appendChild(heading);

            data.sessions.slice().reverse().forEach(function(session, index) {
                const item = document.createElement("div");
                item.className = "history-item";
                item.textContent = session.problem_text + " (" + session.final_stage + ")";
                item.onclick = function() { showHistoryDetail(session); };
                panel.appendChild(item);

            });

        }

        // show past session logs
        // alert pop up, read only
        function showHistoryDetail(session) {
            let text = "Problem: " + session.problem_text + "\n\n";
            session.messages.forEach(function(m) {
                text += (m.role === "user" ? "Student: " : "Tutor: ") + m.content + "\n\n";
            });
            alert(text);

        }

        // run once the page loads
        loadHistory();

        // chat bubbles for tutor and student
        function addMessage(text, sender) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "message " + sender;
            div.textContent = text;
            chat.appendChild(div);

            //auto scroll to newest message
            chat.scrollTop = chat.scrollHeight;

        }

        // add thinking bubble to show student the API is working
        function addThinkingIndicator() {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "message tutor";
            div.id = "thinking-indicator";
            div.textContent = "...";
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeThinkingIndicator() {
            const indicator = document.getElementById("thinking-indicator");
            if (indicator) indicator.remove();

        }

        // Enter or send
        document.getElementById("message-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendMessage();
        });

    </script>

</body>
</html>
