<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STEM Tutor</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;

        }
        #chat {
            border: 1px solid #ccc;
            border-radius: 8px;
            height: 450px;
            overflow-y: auto;
            padding: 16px;
            margin-bottom: 16px;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
        }
        .tutor {
            background: #eef2ff;
            margin-right: auto;
        }
        .student {
            background: #d1fae5;
            margin-left: auto;
            text-align: right;
        }
        #input-row {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 15px;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <h2>STEM Tutor</h2>

    <div id="setup">
        <p>What algebra problem do you need help with?</p>
        <div id="input-row">
            <input type="text" id="problem-input" placeholder="for example: x^2 - x - 6 = 0">
            <button onclick="startSession()">Start</button>
        </div>
    </div>

    <div id="chat" style="display: none;"></div>
    <div id="input-row-chat" style="display: none;">
        <input type="text" id="message-input" placeholder="Type your answer...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function startSession() {
            const problemText = document.getElementById("problem-input").value.trim();
            if (!problemText) return;

            const response = await fetch("/api/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ problem_text: problemText })
            });
            const data = await response.json();

            if (!data.ok) {
                alert(data.error);
                return;
            }

            document.getElementById("setup").style.display = "none";
            document.getElementById("chat").style.display = "block";
            document.getElementById("input-row-chat").style.display = "flex";

            addMessage(data.reply, "tutor");

        }

        async function sendMessage() {
            const input = document.getElementById("message-input");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "student");
            input.value = "";

            const response = await fetch("/api/message", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message})
            });
            const data = await response.json();

            addMessage(data.reply, "tutor");

        }

        function addMessage(text, sender) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "message " + sender;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;

        }

        document.getElementById("message-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendMessage();
        });

    </script>

</body>
</html>
