<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STEM Tutor</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;

        }
        #chat {
            border: 1px solid #ccc;
            border-radius: 8px;
            height: 450px;
            overflow-y: auto;
            padding: 16px;
            margin-bottom: 16px;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
        }
        .tutor {
            background: #eef2ff;
            margin-right: auto;
        }
        .student {
            background: #d1fae5;
            margin-left: auto;
            text-align: right;
        }
        #input-row {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 15px;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
        }

        #history {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;

        }
        .history-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;

        }
        .history-item:hover {
            background: #f5f5f5
        }
    </style>
</head>
<body>
    <h2>STEM Tutor</h2>
    <div id="history"></div>

    <div id="setup">
        <p>What algebra problem do you need help with?</p>
        <div id="input-row">
            <input type="text" id="problem-input" placeholder="for example: x^2 - x - 6 = 0">
            <button onclick="startSession()">Start</button>
        </div>
    </div>

    <div id="chat" style="display: none;"></div>
    <div id="input-row-chat" style="display: none;">
        <input type="text" id="message-input" placeholder="Type your answer...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <div id="reset-row" style="display: none; margin-top: 12px;">
        <button onclick="resetSession()">New Problem</button>
    </div>

    <script>
        async function startSession() {
            const problemText = document.getElementById("problem-input").value.trim();
            if (!problemText) return;

            document.getElementById("problem-input").disabled = true;
            document.querySelector("#input-row button").disabled = true;
            document.querySelector("#input-row button").textContent = "Thinking...";

            const response = await fetch("/api/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ problem_text: problemText })
            });
            const data = await response.json();

            if (!data.ok) {
                alert(data.error);
                document.getElementById("problem-input").disabled = false;
                document.querySelector("#input-row button").disabled = false;
                document.querySelector("#input-row button").textContent = "Start";
                return;
            }

            document.getElementById("setup").style.display = "none";
            document.getElementById("chat").style.display = "block";
            document.getElementById("input-row-chat").style.display = "flex";
            document.getElementById("reset-row").style.display = "block";

            addMessage(data.reply, "tutor");

        }

        async function sendMessage() {
            const input = document.getElementById("message-input");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "student");
            input.value = "";

            input.disabled = true;
            document.querySelector("#input-row-chat button").disabled = true;
            addThinkingIndicator();

            const response = await fetch("/api/message", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message})
            });
            const data = await response.json();

            removeThinkingIndicator();
            addMessage(data.reply, "tutor");

            input.disabled = false;
            document.querySelector("#input-row-chat button").disabled = false;
            input.focus();

        }

        async function resetSession() {
            await fetch("/api/reset", { method: "POST" });
            loadHistory();

            document.getElementById("chat").innerHTML = "";
            document.getElementById("chat").style.display = "none";
            document.getElementById("input-row-chat").style.display = "none";
            document.getElementById("reset-row").style.display = "none";

            document.getElementById("problem-input").value = "";
            document.getElementById("problem-input").disabled = false;
            document.querySelector("#input-row button").disabled = false;
            document.querySelector("#input-row button").textContent = "Start";
            document.getElementById("setup").style.display = "block";

        }

        async function loadHistory() {
            const response = await fetch("/api/history");
            const data = await response.json();

            const panel = document.getElementById("history");
            panel.innerHTML = "";

            if (data.sessions.length === 0) return;

            const heading = document.createElement("h3");
            heading.textContent = "Past Problems";
            panel.appendChild(heading);

            data.sessions.slice().reverse().forEach(function(session, index) {
                const item = document.createElement("div");
                item.className = "history-item";
                item.textContent = session.problem_text + " (" + session.final_stage + ")";
                item.onclick = function() { showHistoryDetail(session); };
                panel.appendChild(item);

            });

        }

        function showHistoryDetail(session) {
            let text = "Problem: " + session.problem_text + "\n\n";
            session.messages.forEach(function(m) {
                text += (m.role === "user" ? "Student: " : "Tutor: ") + m.content + "\n\n";
            });
            alert(text);

        }

        loadHistory();

        function addMessage(text, sender) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "message " + sender;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;

        }

        function addThinkingIndicator() {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "message tutor";
            div.id = "thinking-indicator";
            div.textContent = "...";
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeThinkingIndicator() {
            const indicator = document.getElementById("thinking-indicator");
            if (indicator) indicator.remove();

        }
        document.getElementById("message-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendMessage();
        });

    </script>

</body>
</html>
